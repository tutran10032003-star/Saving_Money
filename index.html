<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Buddy Home Manager</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --border-color: #e6dec5;
            --text-main: #3d332a;
            --accent-brown: #5c4033;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Thẻ chung */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        /* 1. Biểu giá điện trong ngày (1 hàng ngang) */
        .tariff-single-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fdfbf7;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #e6dec5;
            font-size: 13px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tariff-title {
            font-weight: bold;
            color: #b87333;
        }

        .tariff-item {
            background: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        /* 2. Nhắc nhở & Mẹo xanh (1 hàng ngang gọn) */
        .reminder-single-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fffbe6;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #ffe58f;
            font-size: 13px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .reminder-label {
            font-weight: bold;
            color: #d48806;
        }

        /* 3. Phần Hẹn Giờ Nấu Nướng & An Toàn */
        .cooking-card h3 {
            font-size: 18px; /* Tăng size chữ tiêu đề to rõ */
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 6px;
        }

        .cooking-instruction {
            font-size: 15px; /* Tăng size chữ hướng dẫn */
            color: #555;
            margin-bottom: 12px;
        }

        .cooking-time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .time-btn {
            background: #fff;
            border: 1px solid #dcd3b8;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px; /* Tăng size chữ nút bấm */
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .time-btn.full-width {
            grid-column: span 3; /* Đưa nút 60 phút xuống hàng riêng, kéo dài cân đối */
            background: #f5efe6;
            font-weight: bold;
        }

        .time-btn:active {
            background: #e3d7c1;
        }

        .custom-time-box {
            display: flex;
            gap: 8px;
        }

        .custom-time-box input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #dcd3b8;
            font-size: 14px;
            outline: none;
        }

        .start-btn {
            background: var(--accent-brown);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. BẢNG GIÁ ĐIỆN (1 HÀNG NGANG) -->
    <div class="tariff-single-row">
        <span class="tariff-title">⚡ Biểu Giá (SS Saver):</span>
        <span class="tariff-item">🌞 Bình Thường: <b>€0.3719</b></span>
        <span class="tariff-item">🔴 Cao Điểm: <b>€0.3968</b></span>
        <span class="tariff-item">🟢 Đêm: <b>€0.1954</b></span>
    </div>

    <!-- 2. NHẮC NHỞ & MẸO XANH (1 HÀNG NGANG) -->
    <div class="reminder-single-row">
        <span class="reminder-label">💡 Nhắc Nhở:</span>
        <span>💡 Tắt đèn phòng</span> • 
        <span>🔒 Khóa cửa cẩn thận</span> • 
        <span>🔌 Rút phích cắm chờ</span> • 
        <span>🚿 Tắt bình nước nóng</span>
    </div>

    <!-- 3. HẸN GIỜ NẤU NƯỚNG & AN TOÀN (TĂNG FONT CHỮ & 60 PHÚT XUỐNG DƯỚI) -->
    <div class="card cooking-card">
        <h3>🕒 Hẹn Giờ Nấu Nướng & Kiểm Tra An Toàn</h3>
        <p class="cooking-instruction">Chọn thời gian nấu (hoặc nhập số phút tùy ý):</p>
        
        <div class="cooking-time-grid">
            <button class="time-btn" onclick="setCookingTime(15)">15 phút</button>
            <button class="time-btn" onclick="setCookingTime(30)">30 phút</button>
            <button class="time-btn" onclick="setCookingTime(45)">45 phút</button>
            <!-- 60 phút đã được đưa xuống hàng dưới độc lập -->
            <button class="time-btn full-width" onclick="setCookingTime(60)">60 phút</button>
        </div>

        <div class="custom-time-box">
            <input type="number" id="customMinutes" placeholder="Nhập số phút tùy ý...">
            <button class="start-btn" onclick="startCustomTimer()">Bắt Đầu</button>
        </div>
    </div>

</div>

<script>
    function setCookingTime(minutes) {
        alert("Đã chọn thời gian nấu: " + minutes + " phút");
    }

    function startCustomTimer() {
        const mins = document.getElementById("customMinutes").value;
        if(mins) {
            alert("Đã bắt đầu hẹn giờ: " + mins + " phút");
        } else {
            alert("Vui lòng nhập số phút hợp lệ!");
        }
    }
</script>

</body>
</html>
